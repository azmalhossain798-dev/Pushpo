<!doctype html><html lang="en"><meta charset="utf-8"><title>Pushpo responsive verification</title>
<style>body{margin:0;padding:12px;background:#0a1d2a;color:#fff0cd;font:14px system-ui}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:10px}button{padding:8px}iframe{display:block;border:1px solid #cda754}output{display:block;margin:8px 0}</style>
<header><strong>Actual embedded game viewport</strong><button data-size="844,390">Phone landscape</button><button data-size="390,844">Phone portrait</button><button data-size="1280,720">Desktop</button><button id="inspect">Inspect canvas</button></header>
<output id="result">844 × 390 · same application, independent browsing context</output>
<iframe src="./" width="844" height="390" title="Pushpo game test viewport" allow="fullscreen"></iframe>
<script>
const frame=document.querySelector('iframe'),result=document.querySelector('#result');
for(const button of document.querySelectorAll('[data-size]'))button.onclick=()=>{const [w,h]=button.dataset.size.split(',');frame.width=w;frame.height=h;result.textContent=w+' × '+h+' · resize in place';};
document.querySelector('#inspect').onclick=()=>{const w=frame.contentWindow,c=frame.contentDocument.querySelector('#game');result.textContent=`Viewport ${w.innerWidth} × ${w.innerHeight}; canvas ${c.width} × ${c.height}; DPR ${w.devicePixelRatio}; ${c.dataset.renderer}`;};
</script></html>
