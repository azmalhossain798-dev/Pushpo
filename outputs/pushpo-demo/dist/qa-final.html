<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pushpo final mission QA</title><link rel="stylesheet" href="style-v2.css"><style>body{display:flex;flex-direction:column;height:100dvh}header{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:#152c43;font:12px system-ui}button{padding:7px}output{padding:7px 12px;font:12px system-ui}main{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block}</style></head><body>
<header><strong>Final mission · actual engine</strong><button id="rescue">Start rescue</button><button id="arrive">Arrive on time</button><button id="expire">Miss deadline</button><button id="freeze">Hercules freeze</button><button id="finish">Defeat group → farewell</button></header><output id="result">Loading…</output><main id="scene"><canvas id="stage"></canvas></main>
<script src="vendor/pixi-8.22.0.min.js"></script><script type="module">
import {PixiPainter} from './pixi-renderer.mjs';
import {createRun,spawnBoss,attack,update,continueStory,formatTime} from './engine-v3.mjs';
import {currentStoryBeat} from './story-v6.mjs';
import {presentStoryCard} from './story-ui-v8.mjs';
import {castHerculesFreeze,finalGroup,FINAL_RULES} from './final-v9.mjs';
import {project} from './scene-v3.mjs';
const markup=new DOMParser().parseFromString(await(await fetch('./index.html')).text(),'text/html');document.querySelector('#scene').append(document.importNode(markup.getElementById('story-screen'),true));
const painter=new PixiPainter(document.querySelector('#stage'));await painter.ready;let game=createRun(9901),shown='',last=performance.now(),time=0,frameId=0;
function finishCards(){for(let i=0;i<1600&&(game.story||game.cinematic);i++){if(game.story)continueStory(game);else update(game,.03);}}
function hit(){game.player.attack=0;attack(game);for(let i=0;i<40&&game.player.pendingHit;i++)update(game,.01);}
function fixture(){game=createRun(9901);game.player.invulnerable=9999;game.kills=10;game.spawnClock=999;
 for(let stage=0;stage<2;stage++){game.points=stage?300:150;spawnBoss(game);const b=game.actors.find(a=>a.kind==='boss'&&!a.dead);Object.assign(game.player,{x:b.x+25,y:b.y});b.hp=35;hit();finishCards();}
 game.finalMission.investigationElapsed=90;for(let i=0;i<6000&&!game.finalMission.spawned;i++)update(game,.03);shown='';last=performance.now();const h=game.actors.find(a=>a.role==='hercules');painter.camera=project(h.x,h.y);
}
document.querySelector('#rescue').onclick=fixture;
document.querySelector('#arrive').onclick=()=>{if(game.finalMission.state!=='rescue')return;Object.assign(game.player,{x:3730,y:2195});update(game,.01);};
document.querySelector('#expire').onclick=()=>{if(game.finalMission.state==='rescue')update(game,game.finalMission.remaining+.01);};
document.querySelector('#freeze').onclick=()=>{const h=game.actors.find(a=>a.role==='hercules');if(h)castHerculesFreeze(game,h);};
document.querySelector('#finish').onclick=()=>{if(game.finalMission.state!=='combat')return;const h=game.actors.find(a=>a.role==='hercules');h.attack=999;h.pendingHit=null;for(const a of finalGroup(game))for(let i=0;i<20&&!a.dead;i++){Object.assign(game.player,{x:a.x-22,y:a.y});a.cooldown=999;hit();}};
document.querySelector('#story-next').onclick=()=>continueStory(game);
window.addEventListener('keydown',e=>{if(game.story&&['Enter','Space'].includes(e.code)&&!e.repeat){e.preventDefault();continueStory(game);}});
const observer=new ResizeObserver(()=>painter.resize());observer.observe(document.querySelector('#scene'));painter.resize();
function frame(now){const dt=Math.min(.06,(now-last)/1000);last=now;update(game,dt);time+=dt;const beat=currentStoryBeat(game),screen=document.querySelector('#story-screen');screen.classList.toggle('hidden',!beat);if(beat&&shown!==beat.id){shown=beat.id;presentStoryCard(document,game,beat);}if(!beat)shown='';
 const h=game.actors.find(a=>a.role==='hercules'),focus=game.cinematic?.focus??h??game.player;painter.render({...game,cinematic:{focus}},time,true);
 document.querySelector('#result').textContent=`${game.finalMission.state} · ${formatTime(game.finalMission.remaining??60)} · Hercules ${Math.ceil(h?.hp??0)} / ${h?.maxHp??0} · Freeze ${Math.ceil(h?.freezeCooldown??0)}s · ${finalGroup(game).map(a=>a.label+': '+a.hp+'/'+a.maxHp).join(' · ')} · ${game.status==='lost'?game.reason:game.status}`;frameId=requestAnimationFrame(frame);}
frameId=requestAnimationFrame(frame);window.addEventListener('pagehide',()=>{cancelAnimationFrame(frameId);observer.disconnect();painter.destroy();},{once:true});
</script></body></html>
